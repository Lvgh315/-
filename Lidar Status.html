      <li><strong>点大小</strong>：对应功耗（单位：W）</li>
      <li><strong>点颜色</strong>：表示量产年份（颜色越深表示年份越近）</li>

    function populateSelect(id, values) {
      const sel = document.getElementById(id);
      sel.innerHTML = '<option value="all">全部</option>';
      values.forEach(v => sel.innerHTML += `<option value="${v}">${v}</option>`);
    }

    populateSelect('manufacturer', [...new Set(rawData.map(d => d.厂商))]);
    populateSelect('year', [...new Set(rawData.map(d => d.年份))].sort((a,b)=>a-b));
    populateSelect('tech', [...new Set(rawData.map(d => d.技术路线))]);
    populateSelect('range', [...new Set(rawData.map(d => d.距离类型))]);

    function filterData() {
      const mf = document.getElementById('manufacturer').value;
      const yr = document.getElementById('year').value;
      const tr = document.getElementById('tech').value;
      const rt = document.getElementById('range').value;
      return rawData.filter(d =>
        (mf === 'all' || d.厂商 === mf) &&
        (yr === 'all' || d.年份 == yr) &&
        (tr === 'all' || d.技术路线 === tr) &&
        (rt === 'all' || d.距离类型 === rt)
      );
    }

    function plot(data) {
      const trace = {
        x: data.map(d => d.FOV),
        y: data.map(d => d.分辨率 || 0),
        text: data.map(d => `${d.厂商} ${d.型号}<br>功耗: ${d.功耗 || '—'}W<br>应用: ${d.应用}`),
        mode: 'markers',
        type: 'scatter',
        marker: {
          size: data.map(d => (d.功耗 || 5) * 1.5),
          color: data.map(d => d.年份),
          colorscale: 'Viridis',
          showscale: true,
          colorbar: { title: '量产年份' }
        },
        hoverinfo: 'text'
      };
      const layout = {
        title: 'LiDAR 产品分布图：FOV vs 点密度（大小=功耗，颜色=年份）',
        xaxis: { title: 'FOV (°)' },
        yaxis: { title: '点密度 (M点/秒)' },
        hovermode: 'closest'
      };
      Plotly.newPlot('chart', [trace], layout);
    }

    ['manufacturer', 'year', 'tech', 'range'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => plot(filterData()));
    });

    plot(rawData);
  </script>
</body>
</html>
