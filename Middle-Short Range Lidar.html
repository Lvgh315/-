
<!DOCTYPE html>
<html>
<head>
    <title>中-短距离激光雷达趋势预测</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div id="plotDiv" style="width: 1000px; height: 600px;"></div>

    <script>
        const years = [2025, 2026, 2027, 2030];
        const data = [
            {
                x: years, y: [0.94, 0.9, 0.8, 0.8],
                name: '重量 (kg)', type: 'scatter', mode: 'lines+markers',
                line: { width: 3, color: '#1f77b4' }, yaxis: 'y'
            },
            {
                x: years, y: [13.5, 12, 12, 10],
                name: '功耗 (W)', type: 'scatter', mode: 'lines+markers',
                line: { width: 3, color: '#ff7f0e' }, yaxis: 'y2'
            },
            {
                x: years, y: [650, 500, 400, 250],
                name: '成本 (美元)', type: 'scatter', mode: 'lines+markers',
                line: { width: 3, color: '#2ca02c' }, yaxis: 'y3'
            },
            {
                x: years, y: [1.0, 1.5, 2.0, 3.0],
                name: '点速 (M pts/s)', type: 'scatter', mode: 'lines+markers',
                line: { width: 3, color: '#d62728' }, yaxis: 'y4'
            },
            {
                x: years, y: [25, 25, 30, 30],
                name: '垂直FOV (°)', type: 'scatter', mode: 'lines+markers',
                line: { width: 3, color: '#9467bd' }, yaxis: 'y5'
            }
        ];

        const layout = {
            title: '中-短距离激光雷达趋势预测 (2025-2030)',
            width: 1000, height: 600,
            margin: { l: 120, r: 200, b: 80, t: 100 },
            xaxis: { title: '年份', tickvals: years },
            yaxis: { title: '重量 (kg)', titlefont: { color: '#1f77b4' }, range: [0.7, 1.0] },
            yaxis2: { title: '功耗 (W)', titlefont: { color: '#ff7f0e' }, anchor: 'free', overlaying: 'y', side: 'right', position: 0.85, range: [9, 14] },
            yaxis3: { title: '成本 (美元)', titlefont: { color: '#2ca02c' }, anchor: 'free', overlaying: 'y', side: 'right', position: 0.92, range: [200, 700] },
            yaxis4: { title: '点速 (M pts/s)', titlefont: { color: '#d62728' }, anchor: 'free', overlaying: 'y', side: 'right', position: 0.99, range: [0.5, 3.5] },
            yaxis5: { title: '垂直FOV (°)', titlefont: { color: '#9467bd' }, anchor: 'free', overlaying: 'y', side: 'left', position: 0.05, range: [20, 35] },
            legend: { x: 0.5, y: -0.15, xanchor: 'center', orientation: 'h' },
            hovermode: 'x unified'
        };

        Plotly.newPlot('plotDiv', data, layout);
    </script>
</body>
</html>
