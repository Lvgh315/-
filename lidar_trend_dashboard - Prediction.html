    const yearRanges = Object.keys(data.short);
    const sequences = ["全部", ...Object.keys(data)];
    const productTypes = ["广角低分辨率","广角中分辨率","广角高分辨率","全景低分辨率","全景中分辨率","全景高分辨率"];
    const parameters = ["全部","resolution","pointDensity","power","cost"];
    const techPaths = ["全部","Flash","MEMS","转镜","FMCW/4D","OPA","混合架构"];

    function populateControls() {
      function addOptions(el, arr) { el.innerHTML = ''; arr.forEach(v => el.add(new Option(v, v))); }
      addOptions(document.getElementById('yearRangeSelect'), yearRanges);
      addOptions(document.getElementById('sequenceSelect'), sequences);
      addOptions(document.getElementById('parameterSelect'), parameters);
      addOptions(document.getElementById('techPathSelect'), techPaths);
      ['compare1','compare2'].forEach(id => addOptions(document.getElementById(id), sequences));
    }

    function updateChart() {
      const mode = document.getElementById('modeSelect').value;
      const year = document.getElementById('yearRangeSelect').value;
      const seq = document.getElementById('sequenceSelect').value;
      const param = document.getElementById('parameterSelect').value;
      const tech = document.getElementById('techPathSelect').value;
      const c1 = document.getElementById('compare1').value;
      const c2 = document.getElementById('compare2').value;
      let traces = [];
      const seqList = seq === '全部' ? Object.keys(data) : [seq];
      if (mode === 'deployment') {
        seqList.forEach(sq => {
          productTypes.forEach(pt => {
            const d = data[sq][year]?.[pt];
            if (d) traces.push({ x:[
              sq + ' - ' + pt
            ], y:[d.deploymentRank], marker:{ size:d.deploymentRank*10, color:yearRanges.indexOf(year) }, name:pt, type:'scatter' });
          });
        });
      } else if (mode === 'parameterTrend') {
        seqList.forEach(sq => {
          productTypes.forEach(pt => {
            if (param==='全部') return;
            traces.push({ x:yearRanges, y:yearRanges.map(y=>data[sq][y][pt]?.[param]||null), name: sq+'-'+pt, mode:'lines+markers', type:'scatter' });
          });
        });
      } else if (mode === 'techDeployment') {
        seqList.forEach(sq => {
          productTypes.forEach(pt => {
            const d = data[sq][year]?.[pt];
            if (d && (tech==='全部' || d.tech===tech)) traces.push({ x:[sq+' - '+pt], y:[d.deploymentRank], marker:{ symbol:100+techPaths.indexOf(d.tech), size:12, color:yearRanges.indexOf(year) }, name:pt, type:'scatter' });
          });
        });
      } else if (mode === 'sequenceCompare') {
        [c1,c2].forEach(sq => {
          if (sq==='全部') return;
          if (param==='全部') return;
          traces.push({ x:yearRanges, y:yearRanges.map(y=>data[sq][y]['广角中分辨率']?.[param]||null), name:sq, mode:'lines+markers', type:'scatter' });
        });
      }
      Plotly.newPlot('chart', traces, { margin:{ t:40 }, legend:{ orientation:'h' } });
    }

    populateControls();
    document.querySelectorAll('.controls select').forEach(el=>el.addEventListener('change', updateChart));
    updateChart();
